global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'knowledgeflow-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:48080']
        labels:
          service: knowledgeflow-backend
  - job_name: 'knowledgeflow-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000']
        labels:
          service: knowledgeflow-ai
