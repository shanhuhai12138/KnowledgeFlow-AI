# KnowledgeFlow 全量部署 Nginx 配置
# 反代：/admin-api → backend:48080、/ai → ai-service:8000、/ → 前端静态资源（SPA fallback）

server {
    listen 80;
    # Docker 内嵌 DNS：运行时解析服务名，避免启动顺序导致 nginx 崩溃（P0-3）
    resolver 127.0.0.11 valid=30s ipv6=off;
    server_name _;
    client_max_body_size 64m;

    # 前端静态资源（SPA）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（含 SSE 流式）
    location /admin-api/ {
        set $backend_upstream http://backend:48080;
        # 变量式 proxy_pass 不做前缀替换，原始 URI 已带 /admin-api 前缀，直接透传
        rewrite ^/admin-api(/.*)$ $1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE：关闭缓冲 + 长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AI 服务（SSE）
    location /ai/ {
        set $ai_upstream http://ai-service:8000;
        # FastAPI 路由本身就定义在 /ai/* 下，原样透传
        proxy_pass $ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
