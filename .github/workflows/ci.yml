name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build Backend
        run: cd backend && mvn clean package -DskipTests

  backend-domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install Parent & Framework Modules (skip tests)
        # 干净环境先安装父 POM 与依赖模块（跳过框架层遗留测试），再单跑领域模块测试
        run: cd backend && mvn install -q -DskipTests -pl knowledgeflow-module -am
      - name: Run Domain Module Tests
        # 领域模块单测（权限 11 + 枚举 9）；框架层遗留测试不在 CI 范围
        run: cd backend && mvn surefire:test -pl knowledgeflow-module
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/knowledgeflow-server/target/*.jar

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: cd frontend && npm ci
      - name: Build Frontend
        run: cd frontend && npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
  ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r ai-service/requirements.txt pytest
      - name: Run Tests
        # python -m pytest：把 ai-service 加进 sys.path，pytest 控制台命令不会加，rag 包会导入失败
        run: cd ai-service && python -m pytest tests -v

  eval-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Eval scorer self-test
        # 评测脚本指标计算自检（mock 固定结果，无需服务/依赖）
        run: python ai-service/tests/eval_retrieval.py --self-test

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: cd frontend && npm ci
      - name: Run Tests
        run: cd frontend && npx vitest run
